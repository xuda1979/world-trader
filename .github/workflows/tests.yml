name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python -m pip install --no-deps .
      - name: Installed entry point outside checkout
        working-directory: ${{ runner.temp }}
        run: world-trader sources

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m world_trader smoke --report data/live-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-smoke
          path: data/live-smoke.json
