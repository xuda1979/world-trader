; Root pytest config for the world-trader campaign.
;
; WHY THIS EXISTS (defect D13, standup #106):
;   A bare `python3 -m pytest` from the repo root used to ABORT during collection and
;   run ZERO tests. tools/test_options_cboe.py is a standalone check-script (module-level
;   check(...) calls ending in sys.exit(0) at line 148), not a pytest module; the rootdir
;   sweep imported it, SystemExit propagated, and pytest raised INTERNALERROR. The usual
;   `| tail` wrapper then masked the status, so the run read as green.
;
; WHAT THIS DOES:
;   Makes a bare `pytest` mean the campaign suite. Explicit paths still override
;   testpaths, so `python3 tools/test_options_cboe.py` and `pytest <path>` are unchanged.
;
; NOTE: the deeper fix -- rename tools/test_options_cboe.py to check_options_cboe.py, or
; guard its module-level body under `if __name__ == "__main__":` -- is deliberately NOT
; done here; it edits a file cited by campaign docs and was left to a normal work item.

[pytest]
testpaths = campaign/bt
