[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-trader"
version = "0.1.0"
description = "Free official API data ingestion with auditable research snapshots"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
world-trader = "world_trader.cli:main"

[tool.setuptools.packages.find]
include = ["world_trader*"]
